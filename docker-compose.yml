version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: food-ordering-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-food-ordering-db}
    ports:
      - '5432:5432'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    networks:
      - food-ordering-network

  # NestJS API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-ordering-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      API_PORT: ${API_PORT:-8080}
    ports:
      - '${API_PORT:-8080}:8080'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - db
    networks:
      - food-ordering-network
networks:
  food-ordering-network:
    driver: bridge
